name: Deploy Static Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
      
      - name: Debug AWS configuration
        run: |
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Role ARN starts with: ${ROLE_PREFIX}"
        env:
          ROLE_PREFIX: ${{ secrets.AWS_ROLE_ARN }}

      - name: Dump OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log(payload);
            
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::771805192902:role/GitHubActionsDeployRole
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Upload static site to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} --delete